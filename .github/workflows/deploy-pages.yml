name: Deploy to GitHub Pages

# Publishes the built app to GitHub Pages on every push to main.
# The repo root is a Vite source tree, so Pages must serve `dist/`, not `/`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run supersede an in-flight deploy, but never cancel one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Build for the project subpath
        # GitHub Pages project sites live at /<repo>/, so the base must match.
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Add SPA fallback
        # GitHub Pages has no rewrite rules. Serving index.html as 404.html lets
        # deep links such as /oscar/app/carproof render instead of hard 404ing.
        run: cp dist/index.html dist/404.html

      - name: Disable Jekyll
        # Stops GitHub from stripping the `_`-prefixed asset paths Vite emits.
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
